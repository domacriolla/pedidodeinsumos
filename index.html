<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos de Insumos — Doma Criolla</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#F4EDE1;
    --surface:#FFFDF9;
    --surface-alt:#F1E5D2;
    --border:#E1D0B4;
    --border-strong:#C9AF88;
    --ink:#311B10;
    --ink-soft:#6E5645;
    --ink-faint:#A6907A;
    --accent:#65341A;
    --accent-ink:#FFFFFF;
    --accent-soft:#EFDCBE;
    --accent-soft-ink:#65341A;
    --danger:#A83A2C;
    --danger-soft:#F2DAD3;
    --danger-ink:#7A2A1F;
    --success:#4C7A43;
    --success-soft:#DDEAD4;
    --success-ink:#345C2C;
    --pending:#B06B1C;
    --pending-soft:#F3DFB8;
    --pending-ink:#7A4B12;
    --shadow: 0 1px 2px rgba(43,38,33,0.06), 0 4px 14px rgba(43,38,33,0.06);
    --radius: 10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1E120A; --surface:#2A1B10; --surface-alt:#332318; --border:#4A3624; --border-strong:#5E4630;
      --ink:#F3E6D3; --ink-soft:#C7AE93; --ink-faint:#93795F;
      --accent:#E2954E; --accent-ink:#241604; --accent-soft:#4A3419; --accent-soft-ink:#F3D9AF;
      --danger:#E08573; --danger-soft:#432421; --danger-ink:#F2C6BC;
      --success:#8FC183; --success-soft:#25331F; --success-ink:#C7E4BC;
      --pending:#E0AA5A; --pending-soft:#40300F; --pending-ink:#F2D89F;
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; background:var(--bg); }
  body{
    color:var(--ink);
    font-family:'Poppins', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:760px; margin:0 auto; padding:0 16px 80px; }
  h1,h2,h3{ font-family:'Cinzel','Poppins',serif; margin:0; letter-spacing:.01em; }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  header.top{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    padding:16px 16px 0;
    border-bottom:1px solid var(--border);
  }
  header.top .head-row{
    max-width:760px; margin:0 auto;
    display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding-bottom:12px;
  }
  header.top h1{ font-size:20px; font-weight:800; letter-spacing:-0.01em; }
  header.top .sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  header.top .refresh{
    background:none; border:1px solid var(--border-strong); border-radius:99px;
    color:var(--ink-soft); font-size:12px; font-weight:600; padding:6px 12px; cursor:pointer;
    font-family:'Poppins',sans-serif; display:flex; align-items:center; gap:5px;
  }
  nav.tabs{ max-width:760px; margin:0 auto; display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    appearance:none; border:none; background:none;
    font-family:'Poppins',sans-serif; font-weight:700; font-size:13.5px;
    color:var(--ink-soft); padding:10px 12px 12px; cursor:pointer;
    border-bottom:2.5px solid transparent; white-space:nowrap;
    display:flex; align-items:center; gap:6px;
  }
  nav.tabs button.active{ color:var(--ink); border-bottom-color:var(--accent); }
  nav.tabs button .count{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600;
    background:var(--pending-soft); color:var(--pending-ink);
    border-radius:99px; padding:1px 6px; min-width:16px; text-align:center;
  }

  main{ padding-top:18px; }
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:16px; }
  .panel-head{ padding:14px 16px; border-bottom:1px dashed var(--border-strong); display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .panel-head h3{ font-size:14.5px; font-weight:700; letter-spacing:.02em; text-transform:uppercase; color:var(--ink-soft); }
  .panel-body{ padding:14px 16px; }

  label.field{ display:block; margin-bottom:12px; }
  label.field .lbl{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
  input[type=text], input[type=password], input[type=date], select, textarea{
    width:100%; font-family:'Poppins',sans-serif; font-size:15px;
    padding:10px 11px; border-radius:8px; border:1px solid var(--border-strong);
    background:var(--surface-alt); color:var(--ink); min-height:42px;
  }
  input[type=text]:focus, input[type=password]:focus, input[type=date]:focus, select:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .user-box{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:480px){ .row2{ grid-template-columns:1fr; } }

  .btn{
    appearance:none; border:none; cursor:pointer;
    font-family:'Poppins',sans-serif; font-weight:700; font-size:14px;
    padding:11px 18px; border-radius:8px;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    min-height:44px;
  }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--border-strong); }
  .btn-sm{ padding:7px 11px; min-height:34px; font-size:12.5px; }
  .btn-block{ width:100%; }

  .cat-block{ border-top:1px dashed var(--border-strong); }
  .cat-block:first-child{ border-top:none; }
  .cat-title{ padding:12px 16px 4px; font-size:12.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-soft-ink); background:var(--accent-soft); }
  .item-row{ display:flex; align-items:center; gap:10px; padding:8px 16px; border-top:1px solid var(--border); }
  .item-row:first-of-type{ border-top:none; }
  .item-name{ flex:1; font-size:14px; line-height:1.3; }
  .item-name .tag-extra{ font-size:10px; font-weight:700; color:var(--success-ink); background:var(--success-soft); border-radius:4px; padding:1px 5px; margin-left:6px; vertical-align:middle; }
  input[type=text].qty-input{ width:54px; flex:none; text-align:center; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px; padding:8px 4px; min-height:38px; }
  .rm-btn{ flex:none; width:30px; height:30px; border-radius:7px; border:1px solid var(--border-strong); background:var(--surface-alt); color:var(--danger); cursor:pointer; font-size:15px; line-height:1; }

  .extra-add{ display:flex; gap:8px; padding:10px 16px 14px; }
  .extra-add input[type=text]{ flex:1; }
  .extra-add input[type=text].qty-input{ width:54px; }

  .badge{ font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; padding:3px 8px; border-radius:99px; white-space:nowrap; }
  .badge-pending{ background:var(--pending-soft); color:var(--pending-ink); }
  .badge-sent{ background:var(--accent-soft); color:var(--accent-soft-ink); }
  .badge-closed{ background:var(--success-soft); color:var(--success-ink); }
  .idr-readonly{ font-size:13px; color:var(--ink-soft); padding:2px 0; }
  .idr-readonly b{ color:var(--ink); font-weight:600; }

  .filters{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); }
  .filters select{ width:auto; min-height:36px; padding:6px 10px; font-size:13px; }
  .filters .btn{ margin-left:auto; }

  .order-card{ padding:13px 16px; border-top:1px solid var(--border); display:flex; align-items:center; gap:12px; cursor:pointer; }
  .order-card:first-child{ border-top:none; }
  .order-card:hover{ background:var(--surface-alt); }
  .order-card .oc-main{ flex:1; min-width:0; }
  .order-card .oc-local{ font-family:'Cinzel',serif; font-weight:700; font-size:14.5px; }
  .order-card .oc-sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .order-card .oc-arrow{ color:var(--ink-faint); font-size:16px; }

  .empty{ padding:34px 16px; text-align:center; color:var(--ink-soft); font-size:14px; }
  .empty .big{ font-size:26px; margin-bottom:6px; }

  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); font-size:13.5px; font-weight:600;
    padding:11px 18px; border-radius:99px; box-shadow:var(--shadow);
    z-index:50; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  .detail-head{ padding:14px 16px; border-bottom:1px dashed var(--border-strong); }
  .detail-head .back{ background:none; border:none; color:var(--ink-soft); font-family:'Poppins',sans-serif; font-size:13px; cursor:pointer; padding:0 0 10px; display:flex; align-items:center; gap:4px; }
  .detail-grid{ display:flex; flex-wrap:wrap; gap:8px 18px; font-size:13px; color:var(--ink-soft); }
  .detail-grid b{ color:var(--ink); font-weight:600; }

  .item-detail-row{ padding:11px 16px; border-top:1px solid var(--border); }
  .item-detail-row:first-of-type{ border-top:none; }
  .item-detail-row .idr-top{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .item-detail-row .idr-name{ flex:1; font-size:14px; }
  .item-detail-row .idr-pedido{ font-size:12px; color:var(--ink-soft); }
  .item-detail-row.st-enviado{ background:var(--success-soft); }
  .item-detail-row.st-no_enviado{ background:var(--danger-soft); }
  .idr-controls{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .idr-controls .qty-input{ min-height:38px; }
  .chk{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft); cursor:pointer; user-select:none; }
  .chk input{ width:16px; height:16px; }
  .idr-motivo{ margin-top:8px; display:grid; grid-template-columns:1fr auto; gap:8px; }
  .idr-motivo input[type=text]{ font-size:13px; }
  .idr-motivo input[type=date]{ font-size:13px; width:150px; }
  @media (max-width:480px){ .idr-motivo{ grid-template-columns:1fr; } .idr-motivo input[type=date]{ width:100%; } }

  .save-bar{ position:sticky; bottom:0; background:var(--bg); padding:12px 0 4px; border-top:1px solid var(--border); display:flex; gap:10px; }

  .catalog-item{ display:flex; align-items:center; gap:10px; padding:7px 16px; border-top:1px solid var(--border); }
  .catalog-item:first-of-type{ border-top:none; }
  .catalog-item .ci-name{ flex:1; font-size:14px; }
  .catalog-add{ display:flex; gap:8px; padding:10px 16px 14px; }
  .catalog-add input{ flex:1; }

  .banner{ background:var(--accent-soft); color:var(--accent-soft-ink); border-radius:var(--radius); padding:11px 14px; font-size:13px; margin-bottom:14px; border:1px solid var(--border-strong); }
  .success-screen{ padding:40px 20px; text-align:center; }
  .success-screen .big{ font-size:34px; margin-bottom:10px; }
  .success-screen h2{ font-size:18px; margin-bottom:6px; }
  .success-screen p{ color:var(--ink-soft); font-size:14px; margin:0 0 20px; }

  ::selection{ background:var(--accent-soft); }

  .print-sheet{ display:none; }
  @media print{
    body > *:not(.print-sheet){ display:none !important; }
    .print-sheet{ display:block !important; padding:10px; color:#111; font-family:'Poppins',sans-serif; }
    .print-sheet h1{ font-size:18px; margin:0 0 6px; font-family:'Cinzel',serif; }
    .print-sheet .ps-meta{ font-size:12.5px; color:#333; margin-bottom:4px; }
    .print-sheet .ps-cat{ font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin:16px 0 4px; border-bottom:1px solid #999; padding-bottom:3px; }
    .print-sheet .ps-item{ display:flex; align-items:center; gap:10px; padding:5px 0; font-size:13px; border-bottom:1px dotted #ccc; }
    .print-sheet .ps-check{ width:13px; height:13px; border:1.4px solid #333; flex:none; }
    .print-sheet .ps-name{ flex:1; }
    .print-sheet .ps-qty{ font-weight:700; font-family:'IBM Plex Mono',monospace; min-width:30px; text-align:right; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="head-row">
    <div>
      <h1>Pedidos de Insumos — Doma Criolla</h1>
    </div>
    <div class="user-box">
      <button class="refresh" id="refreshBtn" type="button">⟳ Actualizar</button>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="nuevo">Nuevo pedido</button>
    <button data-tab="pedidos">Pedidos y envíos <span class="count" id="pendingCount" style="display:none">0</span></button>
    <button data-tab="catalogo">Catálogo</button>
  </nav>
</header>

<div class="wrap">
  <main id="main">
    <div class="empty"><div class="big">🧾</div>Cargando…</div>
  </main>
</div>

<div class="toast" id="toast"></div>
<div class="print-sheet" id="printSheet"></div>

<script>
(function(){
  "use strict";

  var CATEGORIES = [
    {key:"LIMPIEZA", label:"Limpieza"},
    {key:"LIBRERIA", label:"Librería"},
    {key:"FARMACIA", label:"Farmacia"},
    {key:"IMPRESIONES", label:"Impresiones"},
    {key:"PACKAGING", label:"Packaging"}
  ];
  var CAT_LABEL = {};
  CATEGORIES.forEach(function(c){ CAT_LABEL[c.key]=c.label; });

  var LOCALES = [
    {key:"CENTRO", label:"Local Centro"},
    {key:"PATAGONIA", label:"Local Patagonia"},
    {key:"ZELARRAYAN", label:"Local Zelarrayán"}
  ];
  var LOCAL_LABEL = {};
  LOCALES.forEach(function(l){ LOCAL_LABEL[l.key]=l.label; });

  // Pegá acá la URL que te da Apps Script al implementar (Implementar → Nueva
  // implementación → Aplicación web), termina en /exec. Sin esto, la página
  // no tiene con quién hablar para guardar ni leer los pedidos.
  var API_URL = "https://script.google.com/macros/s/AKfycbw9tFfl_MMsORMq5-4iORIYeCZVagJuhkG0ODPs-upTVvOD60GPldXMr85p3ChT51D_/exec";

  var catalogItems = [];
  var pedidos = [];
  var loaded = false;
  var POLL_MS = 20000;

  var state = {
    tab: "nuevo",
    detailId: null,
    newOrderForm: null,
    editForm: null,
    filterEstado: "pendiente",
    filterLocal: "TODOS",
    adminUnlocked: false
  };

  // ---------- server bridge (fetch a la API de Apps Script) ----------
  function apiConfigured(){
    return API_URL && API_URL.indexOf("PEGAR_ACA") === -1;
  }

  function callServer(action, payload){
    if(!apiConfigured()){
      return Promise.reject(new Error("Falta configurar API_URL en Index.html con el link de Apps Script."));
    }
    // Todo viaja por GET (incluso para guardar/editar): Apps Script redirige
    // internamente sus respuestas, y ese redirect descarta el "body" de un
    // POST antes de que llegue al servidor. Mandando todo por GET, con los
    // datos codificados en la URL, evitamos ese problema por completo.
    var url = API_URL + "?action=" + encodeURIComponent(action);
    if(action !== "getData"){
      url += "&payload=" + encodeURIComponent(JSON.stringify(payload||{}));
    }
    return fetch(url, {method:"GET"})
      .then(function(r){ return r.json(); })
      .then(checkApiError_);
  }

  function checkApiError_(data){
    if(data && data.error){ throw new Error(data.error); }
    return data;
  }

  // ---------- helpers ----------
  function todayStr(){
    var d = new Date();
    var m = (d.getMonth()+1+"").padStart(2,"0");
    var day = (d.getDate()+"").padStart(2,"0");
    return d.getFullYear()+"-"+m+"-"+day;
  }
  function fmtDate(s){
    if(!s) return "";
    var p = String(s).split("-");
    if(p.length===3 && p[0].length===4){
      return p[2].slice(0,2)+"/"+p[1]+"/"+p[0];
    }
    // Por si llega algo que no sea "yyyy-mm-dd" (por ejemplo una fecha sin
    // normalizar), lo interpretamos igual en vez de mostrar texto crudo.
    try{
      var d = new Date(s);
      if(isNaN(d.getTime())) return String(s);
      return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"});
    }catch(e){ return String(s); }
  }
  function fmtDateTime(iso){
    try{
      var d = new Date(iso);
      return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"}) + " " + d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
    }catch(e){ return ""; }
  }
  function esc(s){
    return (s==null?"":String(s)).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._h);
    toast._h = setTimeout(function(){ t.classList.remove("show"); }, 2400);
  }
  function safeLS(){ try{ return window.localStorage; }catch(e){ return null; } }
  function lsGet(k, d){ var ls=safeLS(); if(!ls) return d; try{ var v=ls.getItem(k); return v==null?d:v; }catch(e){ return d; } }
  function lsSet(k,v){ var ls=safeLS(); if(!ls) return; try{ ls.setItem(k,v); }catch(e){} }

  function groupByCategory(items){
    var byCat = {};
    CATEGORIES.forEach(function(c){ byCat[c.key]=[]; });
    items.forEach(function(it){
      if(!byCat[it.category]) byCat[it.category]=[];
      byCat[it.category].push(it);
    });
    return byCat;
  }

  // ---------- data load / poll ----------
  function loadData(silent){
    if(!apiConfigured()){
      loaded = true;
      var main = document.getElementById("main");
      main.innerHTML = '<div class="panel"><div class="panel-body"><div class="banner" style="margin:0">'+
        'Falta un paso: abrí este archivo Index.html, buscá la línea <code>API_URL</code> cerca del comienzo del script '+
        'y pegá ahí la URL que te dio Apps Script al implementar (termina en <code>/exec</code>). Después volvé a subirlo a GitHub.'+
        '</div></div></div>';
      return Promise.resolve();
    }
    return callServer("getData").then(function(data){
      catalogItems = data.catalog || [];
      pedidos = data.pedidos || [];
      loaded = true;
      render();
    }).catch(function(err){
      console.error(err);
      if(!silent) toast("No se pudo cargar. Revisá la conexión.");
      if(!loaded){ loaded = true; render(); }
    });
  }

  setInterval(function(){
    // Solo actualiza en segundo plano si no hay algo a medio escribir.
    if(state.tab==="pedidos" && !state.detailId){ loadData(true); }
    else if(state.tab==="catalogo"){ loadData(true); }
  }, POLL_MS);

  // ---------- render root ----------
  function render(){
    var main = document.getElementById("main");
    document.querySelectorAll("#tabs button").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-tab")===state.tab);
    });
    var pendCount = pedidos.filter(function(p){ return p.estado==="pendiente" || p.estado==="enviado"; }).length;
    var pc = document.getElementById("pendingCount");
    if(pendCount>0){ pc.style.display="inline-block"; pc.textContent=pendCount; }
    else { pc.style.display="none"; }

    if(!loaded){
      main.innerHTML = '<div class="empty"><div class="big">🧾</div>Cargando catálogo…</div>';
      return;
    }
    if(state.tab==="nuevo") return renderNuevo(main);
    if(state.tab==="pedidos"){
      if(state.detailId) return renderDetail(main, state.detailId);
      return renderLista(main);
    }
    if(state.tab==="catalogo") return renderCatalogo(main);
  }

  // ---------- TAB: Nuevo pedido ----------
  function buildNewOrderForm(){
    var byCat = groupByCategory(catalogItems);
    var items = {};
    CATEGORIES.forEach(function(c){
      byCat[c.key].forEach(function(it){
        items[it.id] = {id:it.id, category:c.key, name:it.name, qty:""};
      });
    });
    return {
      local: lsGet("dc_last_local", ""),
      quienPide: lsGet("dc_quien_pide", ""),
      fecha: todayStr(),
      notas: "",
      items: items,
      extra: []
    };
  }

  function renderNuevo(main){
    if(!state.newOrderForm){ state.newOrderForm = buildNewOrderForm(); }
    var f = state.newOrderForm;
    var byCat = groupByCategory(catalogItems);

    var html = '';
    if(catalogItems.length===0){
      html += '<div class="banner">Todavía no hay ítems en el catálogo. Cargalos desde la pestaña <b>Catálogo</b>.</div>';
    }
    html += '<div class="panel"><div class="panel-body">';
    html += '<div class="row2">';
    html += fieldSelect("Local", "f_local", LOCALES.map(function(l){return {v:l.key,l:l.label};}), f.local, true);
    html += fieldInput("Fecha del pedido", "f_fecha", "date", f.fecha);
    html += '</div>';
    html += fieldInput("¿Quién pide?", "f_quien", "text", f.quienPide);
    html += fieldInput("Notas (opcional)", "f_notas", "text", f.notas);
    html += '</div></div>';

    CATEGORIES.forEach(function(c){
      var list = byCat[c.key];
      var extraList = f.extra.filter(function(e){ return e.category===c.key; });
      html += '<div class="panel"><div class="cat-block">';
      html += '<div class="cat-title">'+esc(c.label)+'</div>';

  function fieldSelect(label, id, opts, val, withPlaceholder){

    if(withPlaceholder) html += '<option value=""'+(val===""?" selected":"")+' disabled>Elegir…</option>';

  function submitOrder(f){
    if(!f.local){ toast("Elegí un local"); return; }
    if(!f.fecha){ toast("Elegí una fecha"); return; }
    var items = [];
    Object.keys(f.items).forEach(function(id){
      var it = f.items[id];
      if(it.qty && it.qty.trim()!==""){
        items.push({ id:it.id, category:it.category, name:it.name, isExtra:false, pedidoCant:it.qty.trim() });
      }
    });
    f.extra.forEach(function(e){
      if(e.qty && e.qty.trim()!==""){
        items.push({ id:e.tempId, category:e.category, name:e.name, isExtra:true, pedidoCant:e.qty.trim() });
      }
    });
    if(items.length===0){ toast("Cargá al menos una cantidad"); return; }

    var payload = { local:f.local, fecha:f.fecha, quienPide:(f.quienPide||"").trim(), notas:f.notas||"", items:items };
    var btn = document.getElementById("submitOrder");
    if(btn){ btn.disabled = true; btn.textContent = "Enviando…"; }
    callServer("createPedido", payload).then(function(){
      lsSet("dc_last_local", f.local);
      lsSet("dc_quien_pide", payload.quienPide);
      state.newOrderForm = null;
      showOrderSuccess(payload);
      loadData(true);
    }).catch(function(err){
      console.error(err);
      toast("No se pudo enviar: "+(err&&err.message?err.message:"probá de nuevo."));
      if(btn){ btn.disabled=false; btn.textContent="Enviar pedido"; }
    });
  }

  // ---------- exportar historial a CSV (descarga directa en el navegador) ----------
  function csvField(v){
    var s = (v==null? "": String(v));
    if(/[",;\n]/.test(s)) s = '"'+s.replace(/"/g,'""')+'"';
    return s;
  }
  function exportCsv(list){
    if(!list || list.length===0){ toast("No hay pedidos para exportar"); return; }
    var header = ["Local","Fecha","Ítem","Cant. solicitada","Cant. enviada","Cant. recibida"];
    var rows = [header];
    list.forEach(function(p){
      (p.items||[]).forEach(function(it){
        rows.push([
          LOCAL_LABEL[p.local]||p.local, fmtDate(p.fecha), it.name,
          it.pedidoCant||"", it.envioCant||"", it.recibidoCant||""
        ]);
      });
    });
    var csv = "﻿" + rows.map(function(r){ return r.map(csvField).join(","); }).join("\r\n");
    var localTag = state.filterLocal==="TODOS" ? "todos" : state.filterLocal.toLowerCase();
    var filename = "pedidos_insumos_"+localTag+"_"+todayStr()+".csv";

    try{
      var blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      toast("Historial exportado");
    }catch(err){
      console.error(err);
      toast("No se pudo exportar en este navegador");
    }
  }

  function saveDetail(p, mode){
    var f = state.editForm;
    var btn = document.getElementById("saveDetail");

    if(mode==="envio"){
      var items = f.items.map(function(it){
        var estadoItem = "pendiente";
        if(it.noEnviado){ estadoItem = "no_enviado"; }
        else if(it.envioCant && it.envioCant.trim()!==""){ estadoItem = "enviado"; }
        return {
          id:it.id, envioCant:it.envioCant||"", estadoItem: estadoItem,
          motivo: it.noEnviado ? it.motivo : "", fechaEstimada: it.noEnviado ? it.fechaEstimada : ""
        };
      });
      var enviadoPor = (f.quienNombre||"").trim();
      if(btn){ btn.disabled=true; btn.textContent="Guardando…"; }
      callServer("updatePedidoEnvio", {pedidoId:p.id, items:items, enviadoPor:enviadoPor}).then(function(){
        lsSet("dc_quien_envia", enviadoPor);
        toast("Envío guardado");
        state.editForm = null;
        loadData(true);
      }).catch(function(err){
        console.error(err);
        toast("No se pudo guardar: "+(err&&err.message?err.message:"probá de nuevo."));
        if(btn){ btn.disabled=false; btn.textContent="Guardar envío"; }
      });
    } else {
      var recItems = f.items.filter(function(it){ return !it.noEnviado; }).map(function(it){
        return { id:it.id, cantRecibida: it.recibidoCant||"" };
      });
      var recibidoPor = (f.quienNombre||"").trim();
      if(btn){ btn.disabled=true; btn.textContent="Guardando…"; }
      callServer("updatePedidoRecepcion", {pedidoId:p.id, items:recItems, recibidoPor:recibidoPor}).then(function(){
        lsSet("dc_quien_recibe", recibidoPor);
        toast("Recepción guardada");
        state.editForm = null;
        loadData(true);
      }).catch(function(err){
        console.error(err);
        toast("No se pudo guardar: "+(err&&err.message?err.message:"probá de nuevo."));
        if(btn){ btn.disabled=false; btn.textContent="Confirmar recepción"; }
      });
    }
  }

  function renderCatalogo(main){
    var byCat = groupByCategory(catalogItems);
    var unlocked = state.adminUnlocked;
    var html = '';

    if(!unlocked){
      html += '<div style="display:flex;justify-content:flex-end;margin-bottom:14px">'+
        '<button class="btn btn-ghost btn-sm" id="unlockCatalog" type="button">🔒 Editar catálogo</button>'+
        '</div>';
    } else {
      html += '<div class="banner" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">'+
        '<span>Modo edición activo. Los cambios aplican a los <b>próximos</b> pedidos; los ya cargados no se modifican.</span>'+
        '<button class="btn btn-ghost btn-sm" id="lockCatalog" type="button">Salir del modo edición</button>'+
        '</div>';
    }

    CATEGORIES.forEach(function(c){
      var list = byCat[c.key].slice().sort(function(a,b){ return (a.order||0)-(b.order||0) || a.name.localeCompare(b.name); });
      html += '<div class="panel"><div class="cat-block">';
      html += '<div class="cat-title">'+esc(c.label)+' <span class="mono" style="font-weight:500;opacity:.7">('+list.length+')</span></div>';
      list.forEach(function(it){
        html += '<div class="catalog-item">';
        html += '<div class="ci-name">'+esc(it.name)+'</div>';
        if(unlocked) html += '<button class="rm-btn" data-del-item="'+it.id+'" title="Eliminar" type="button">×</button>';
        html += '</div>';
      });
      if(unlocked){
        html += '<div class="catalog-add">';
        html += '<input type="text" placeholder="Nuevo ítem en '+esc(c.label)+'…" data-newcat="'+c.key+'">';
        html += '<button class="btn btn-ghost btn-sm" data-addcat="'+c.key+'" type="button">+ Agregar</button>';
        html += '</div>';
      }
      html += '</div></div>';
    });
    main.innerHTML = html;

    var unlockBtn = document.getElementById("unlockCatalog");
    if(unlockBtn){
      unlockBtn.addEventListener("click", function(){
        var pass = window.prompt("Clave para editar el catálogo:");
        if(pass==null) return;
        unlockBtn.disabled = true;
        callServer("checkAdmin", {password:pass}).then(function(res){
          if(res && res.ok){
            adminPassword_ = pass;
            state.adminUnlocked = true;
            renderCatalogo(main);
          } else {
            toast("Clave incorrecta.");
            unlockBtn.disabled = false;
          }
        }).catch(function(err){ console.error(err); toast("No se pudo verificar la clave."); unlockBtn.disabled=false; });
      });
    }
    var lockBtn = document.getElementById("lockCatalog");
    if(lockBtn){
      lockBtn.addEventListener("click", function(){
        adminPassword_ = null;
        state.adminUnlocked = false;
        renderCatalogo(main);
      });
    }

    main.querySelectorAll("[data-del-item]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-del-item");
        callServer("deleteCatalogItem", {id:id, password:adminPassword_}).then(function(){
          toast("Ítem eliminado");
          loadData(true);
        }).catch(function(err){ console.error(err); toast(permMsg(err, "eliminar")); });
      });
    });
    main.querySelectorAll("[data-addcat]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var cat = btn.getAttribute("data-addcat");
        var input = main.querySelector('[data-newcat="'+cat+'"]');
        var name = (input.value||"").trim();
        if(!name){ input.focus(); return; }
        callServer("addCatalogItem", {categoria:cat, nombre:name, password:adminPassword_}).then(function(){
          input.value="";
          toast("Ítem agregado");
          loadData(true);
        }).catch(function(err){ console.error(err); toast(permMsg(err, "agregar")); });
      });
    });
  }

  // ---------- nav / refresh ----------
  document.getElementById("tabs").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-tab]");
    if(!btn) return;
    state.tab = btn.getAttribute("data-tab");
    if(state.tab!=="pedidos"){ state.detailId=null; }
    render();
  });
  document.getElementById("refreshBtn").addEventListener("click", function(){
    loadData(false);
  });

  // ---------- boot ----------
  loadData(false);
})();
</script>
</body>
</html>
